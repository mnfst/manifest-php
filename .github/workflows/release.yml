name: Prepare release

# Conventional commits accumulate in one rolling release PR. Merging it bumps
# Manifest::VERSION (the `x-release-please-version` line), writes the
# changelog, and tags vX.Y.Z with a GitHub release; Packagist publishes from
# the tag. Nothing is released until that PR is merged.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-prepare
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Note default token fallback
        if: env.HAS_APP != 'true'
        # Pull requests created by GITHUB_TOKEN do not start pull_request
        # workflows, so CI does not run on the release PR itself.
        run: echo "::notice::APP_ID and APP_PRIVATE_KEY are unavailable; using GITHUB_TOKEN for the release PR."

      - name: Open or update release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
